<html>
	<head>
		<title>WMT OS Setup</title>
		<hta:application id="wmtsetup" applicationname="WMTOSSetup" scroll="no" singleinstance="yes" resizable="no" />
		<style>
			html, body {
				margin: 0;
				padding: 0;
				background-color: #f0f0f0;
			}
			body, td, p, input, select, button {
				font-family: sans-serif;
				font-size: 12px;
			}
			div {
				width: 700px;
			}
			h2 {
				margin: 0;
				font-size: 18px;
			}
			p {
				margin: 3px 0 0;
				color: #555;
			}
			fieldset {
				padding: 6px;
				margin: 0;
				box-sizing: border-box;
			}
			legend {
				font-weight: bold;
			}
			table {
				width: 100%;
			}
			.band {
				background-color: #fff;
				border-bottom: 1px solid #ccc;
				padding: 8px 15px;
			}
			.masthead {
				padding-left: 12px;
			}
			.actions {
				text-align: right;
				vertical-align: middle;
			}
			.pane-left {
				padding: 10px 4px 12px 15px;
				vertical-align: top;
			}
			.pane-right {
				padding: 10px 15px 12px 4px;
				vertical-align: top;
			}
			.label {
				text-align: right;
				white-space: nowrap;
				width: 90px;
			}
			input, select {
				width: 100%;
			}
			button {
				padding: 5px 15px;
				overflow: visible;
			}
		</style>
	</head>

	<body>
		<div>
			<table cellspacing="0" cellpadding="0">
				<tr>
					<td class="band" colspan="2">
						<table cellspacing="0" cellpadding="0">
							<tr>
								<td width="72"><img src="logo.png" width="72" height="72" alt="WMT OS"></td>
								<td class="masthead">
									<h2>WMT OS Setup</h2>
									<p>Please configure your initial system settings.</p>
								</td>
								<td class="actions">
									<button onclick="saveSettings()">Save Settings</button>
								</td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td class="pane-left" width="50%">
						<fieldset>
							<legend>System &amp; Root</legend>
							<table cellpadding="3">
								<tr>
									<td class="label">Hostname:</td>
									<td>
										<input id="inp_hostname" value="wmt-os">
									</td>
								</tr>
								<tr>
									<td class="label">Timezone:</td>
									<td>
										<select id="inp_timezone">
											<option value="UTC" selected>UTC</option><!-- tzdata -->
										</select>
									</td>
								</tr>
								<tr>
									<td class="label">Keymap:</td>
									<td>
										<select id="inp_keymap">
											<option value="us" selected>English (US)</option><!-- xkb-data -->
										</select>
									</td>
								</tr>
								<tr>
									<td class="label">Root Password:</td>
									<td>
										<input type="password" id="inp_rootpw">
									</td>
								</tr>
								<tr>
									<td class="label">Confirm Root:</td>
									<td>
										<input type="password" id="inp_rootpw_conf">
									</td>
								</tr>
							</table>
						</fieldset>
					</td>

					<td class="pane-right" width="50%">
						<fieldset>
							<legend>User Account</legend>
							<table cellpadding="3">
								<tr>
									<td class="label">Username:</td>
									<td>
										<input id="inp_username" value="wmt-user">
									</td>
								</tr>
								<tr>
									<td class="label">User Password:</td>
									<td>
										<input type="password" id="inp_userpw">
									</td>
								</tr>
								<tr>
									<td class="label">Confirm User:</td>
									<td>
										<input type="password" id="inp_userpw_conf">
									</td>
								</tr>
							</table>
						</fieldset>
					</td>
				</tr>
			</table>
		</div>

		<script>
			// ActiveX marks the HTA/IE side; its absence marks a modern browser
			var xml = null;
			try { xml = new ActiveXObject("Microsoft.XMLDOM"); } catch (e) {}

			// Keep both boxes the same height
			var f = document.getElementsByTagName("fieldset"), tall = Math.max(f[0].offsetHeight, f[1].offsetHeight);
			f[0].style.height = f[1].style.height = tall + "px";

			// Size the window (or the browser's border box) to the laid-out content
			var box = document.getElementsByTagName("div")[0];
			if (xml) {
				window.moveTo(0, 0);
				var w = box.offsetWidth + window.screenLeft * 2, h = box.offsetHeight + window.screenTop + window.screenLeft;
				window.resizeTo(w, h);
				window.moveTo((screen.width - w) / 2, (screen.height - h) / 2);
			} else {
				box.style.margin = "20px";
				box.style.border = "1px solid #999";
			}

			function saveSettings() {
				var get = function(id) { return document.getElementById(id).value; };

				var hostname    = get("inp_hostname"),
				    timezone    = get("inp_timezone"),
				    keymap      = get("inp_keymap"),
				    rootpw      = get("inp_rootpw"),
				    rootpw_conf = get("inp_rootpw_conf"),
				    username    = get("inp_username"),
				    userpw      = get("inp_userpw"),
				    userpw_conf = get("inp_userpw_conf");

				if (!hostname || !timezone || !keymap || !rootpw || !rootpw_conf || !username || !userpw || !userpw_conf) {
					return alert("All fields are required.");
				}

				var validHostname = /^[a-zA-Z0-9]([a-zA-Z0-9-]{0,62}[a-zA-Z0-9])?$/;
				var validUsername = /^[a-zA-Z][a-zA-Z0-9_-]{0,31}\$?$/;

				if (!validHostname.test(hostname)) return alert("Invalid hostname. Use letters and digits, with hyphens inside (max 63 characters).");
				if (!validUsername.test(username)) return alert("Invalid username. Start with a letter; letters, digits, hyphens, and underscores follow (max 32 characters).");
				if (rootpw !== rootpw_conf)        return alert("Root passwords do not match.");
				if (userpw !== userpw_conf)        return alert("User passwords do not match.");

				var data = "[WMT_OS_SETUP]" +
				    "\nHostname=" + hostname +
				    "\nKeymap=" + keymap +
				    "\nRootPassword=" + rootpw +
				    "\nTimezone=" + timezone +
				    "\nUserName=" + username +
				    "\nUserPassword=" + userpw + "\n";

				if (xml) {
					writeIni(data);
				} else {
					downloadIni(data);
				}
			}

			function writeIni(data) {
				// Resolve setup.ini beside this file from its file:// URL
				var path = unescape(document.URL).replace(/^file:\/\/\/?/i, "").replace(/\//g, "\\");
				if (path.indexOf(":") === -1 && path.charAt(0) !== "\\") path = "\\" + path;
				var ini = path.substring(0, path.lastIndexOf("\\")) + "\\setup.ini";
				try {
					xml.loadXML("<CONFIG><![CDATA[\n" + data + "]]></CONFIG>");
					xml.save(ini);
					alert("Settings saved to:\n" + ini + "\n\nYou may now boot into WMT OS.");
					window.close(); // no-op on Windows CE
				} catch (e) {
					alert("Failed to save settings.\nError: " + e.message);
				}
			}

			function downloadIni(data) {
				try {
					var a = document.createElement("a");
					a.href = URL.createObjectURL(new Blob([data], { type: "application/octet-stream" }));
					a.download = "setup.ini";
					a.click();
					alert("Settings downloaded.\n\nCopy `setup.ini` to the card's boot partition root.\nThen you may boot into WMT OS.");
				} catch (e) {
					alert("Failed to generate settings.\nError: " + e.message);
				}
			}
		</script>
	</body>
</html>
